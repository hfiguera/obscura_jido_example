name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        native: [false, true]
    runs-on: ubuntu-latest

    env:
      OBSCURA_EFFICIENT_TEST: ${{ matrix.native && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-27.3-elixir-1.18.4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp-27.3-elixir-1.18.4-

      - run: mix deps.get
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: matrix.native
        with:
          version: '0.12.1'

      - name: Provision the published efficient assets
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libopenblas0-pthread libpcre2-8-0
          mix compile --warnings-as-errors
          mix obscura.efficient.install --allow-download

      - run: mix precommit
      - run: mix assets.setup
      - run: mix assets.build
